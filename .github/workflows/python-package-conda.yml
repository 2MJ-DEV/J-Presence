name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Miniconda with Python 3.11
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: lab-attendance-ai
          environment-file: environment.yml
          python-version: '3.11'
          auto-activate-base: false

      - name: Compile Python sources
        run: python -m compileall -q app src scripts tests

      - name: Run pytest
        run: python -m pytest -q
